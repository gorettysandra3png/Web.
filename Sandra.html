<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body> 
    <form action="#" method="post">
        <table cellspacing="10" cellpadding="10">
            <tr>
                <td>
                    <label for="fullname">fullname</label>
                </td>
                <td>
                    <input type="text" name="fullname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="gender">Gender</label>
                </td>
                <td>
                    <label for="male" name="gender">male</label>
                    <input type="radio" name="gender">
                    <label for="female" name="gender">female</label>
                    <input type="radio" name="gender">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nationality">Nationality</label>
                </td>
                <td>
                    <select name="nationality" id="#">
                        <option value="Ugandan">Ugandan</option>
                        <option value="Kenyan">Kenyan</option>
                        <option value="Tanzania">Tanzania</option>

                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="marrital">marrital</label>
                </td>
                <td>
                    <label for="marrital" name="married">marrried</label>
                    <input type="radio" name="marrital">
                    <label for="marrital" name="single">single</label>
                    <input type="radio" name="Marrital">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="next of keen" name="Next of keen">Next of keen</label>
                    
                </td>
                <td><input type="text" name="Next of keen"></td>
            </tr>
            <tr>
                <td>
                    <label for="District" name="Home district">Home district</label>
                </td>
                <td><input type="text" name="Home district">
                </td>    
                    
                
            </tr>
            <tr>
                <td>
                    <label for="email" name="Email" >Email address</label>
                </td>
                <td>
                     <input type="text" name="Emai address" placeholder="abc@fw.ug">
                    </td>      
            </tr>
            <tr>
                <td><label for="DOB">D.O.B</label></td>
                    <td> <input type="date" name="D.O.B"></td>
                   
            </tr>
            <tr>
                <td><label for="Phone number">phone number</label></td>
                    <td><input type="tel" name="Phone number"></td>
                    
            
            </tr>
            <tr>
                <td>
                    <label for="Employement">Employement status</label>
                </td>
                <td>
                    <select name="Empolyement status" id="#">
                        <option value="Employed">Employed</option>
                        <option value="Unemployed">Unemployed</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="occupation">occupation</label> 
                </td>
                <td>
                    <input type="text" name="occupation">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Guidiance">Guidiance</label>
                </td>
                <td>
                    <label for="guidiance" name="Father">Father</label>
                    <input type="radio" name="Father">
                    <label for="guidiance" name="mother">mother</label>
                    <label for="guigiance" name="others">others</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Description">Describe yourself</label>
                </td>
                <td>
                    <textarea name="Description" placeholder="Tell us about yourself"></textarea>
                
                </td> 
            </tr>
            <tr>
                <td>
                    <input type="submit" value="submit form"</input>
                </td> 
                <td>
                     <a href="#logg" have an account?>#logg</a>
                </td>
            </tr>

        </table>
    </form>
    
</body>
</html>
